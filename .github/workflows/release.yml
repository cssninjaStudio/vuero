name: release
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git history

      # Enable corepack, note that nodejs is already installed
      - run: corepack enable
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - id: meta
        name: release meta
        run: |
          project=${GITHUB_REPOSITORY#*/}
          echo "PROJECT=${project}" >> "$GITHUB_OUTPUT"
          echo "PROJECT_CAP=${project^}" >> "$GITHUB_OUTPUT"
          echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - id: build_demo
        name: build release demo
        uses: ./.github/actions/build-template-action
        with:
          tag: ${{ steps.meta.outputs.TAG }}
          project: ${{ steps.meta.outputs.PROJECT }}
          package: demo

      - id: build_app
        name: build release app
        uses: ./.github/actions/build-template-action
        with:
          tag: ${{ steps.meta.outputs.TAG }}
          project: ${{ steps.meta.outputs.PROJECT }}
          package: app

      - id: build_app_ssr
        name: build release app-ssr
        uses: ./.github/actions/build-template-action
        with:
          tag: ${{ steps.meta.outputs.TAG }}
          project: ${{ steps.meta.outputs.PROJECT }}
          package: app-ssr

      - id: build_app_electron
        name: build release app-electron
        uses: ./.github/actions/build-template-action
        with:
          tag: ${{ steps.meta.outputs.TAG }}
          project: ${{ steps.meta.outputs.PROJECT }}
          package: app-electron

      - id: build_app_nuxt
        name: build release app-nuxt
        uses: ./.github/actions/build-template-action
        with:
          tag: ${{ steps.meta.outputs.TAG }}
          project: ${{ steps.meta.outputs.PROJECT }}
          package: app-nuxt

      - id: changelog
        name: release changelog
        run: |
          pnpm dlx conventional-changelog-cli -p conventionalcommits -r 2 -n ./.github/.versionrc.js -o ${{ github.workspace }}/CHANGELOG_RELEASE.md
          cat ${{ github.workspace }}/CHANGELOG_RELEASE.md

      - id: create_release
        name: create github draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: ${{ steps.meta.outputs.PROJECT_CAP }} ${{ steps.meta.outputs.TAG }}
          body_path: ${{ github.workspace }}/CHANGELOG_RELEASE.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/${{ steps.build_demo.outputs.filepath }}
            ${{ github.workspace }}/${{ steps.build_app.outputs.filepath }}
            ${{ github.workspace }}/${{ steps.build_app_ssr.outputs.filepath }}
            ${{ github.workspace }}/${{ steps.build_app_electron.outputs.filepath }}
            ${{ github.workspace }}/${{ steps.build_app_nuxt.outputs.filepath }}

      - name: publish github draft release
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
