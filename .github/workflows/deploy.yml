name: deploy
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.vscode/**'
      - 'cypress/**'
      - 'scripts/**'
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - name: Set up dockertags
        id: get_meta
        run: |
          echo ::set-output name=dockertags::digisquad/cssninja.vuero-demo:latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v3
        timeout-minutes: 60
        with:
          push: true
          tags: ${{ steps.get_meta.outputs.dockertags }}
          build-args: |
            VITE_API_BASE_URL=https://api.vuero.cssninja.io
            GTM_ID=GTM-N9P6H6B

      - name: Publish
        uses: appleboy/scp-action@master
        with:
          host: cssninja.io
          username: ci
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.HOST_DIRECTORY }}

      - name: Deploy to cssninja.io
        uses: appleboy/ssh-action@master
        with:
          host: cssninja.io
          username: ci
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.HOST_DIRECTORY }}
            docker-compose pull
            docker-compose up -d --force-recreate --remove-orphans
            docker image prune -f -a --filter "until=24h"
