name: standard-version
on:
  workflow_dispatch:
    inputs:
      options:
        description: 'standard-version options'
  repository_dispatch:
    types: [standard-version]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  # @todo: tests run OOM on GitHub actions runner, we should split them into smaller chunks
  # tests-e2e:
  #   uses: ./.github/workflows/tests-e2e.yml

  standard-version:
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git history
          token: ${{ secrets.APP_GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: |
          git config user.name digisquad-bot
          git config user.email admin@digisquad.io
          pnpm dlx standard-version ${{ github.event.inputs.options }}
          git push --follow-tags origin main
        env:
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
