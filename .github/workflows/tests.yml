name: tests

on:
  workflow_call:

jobs:
  linters:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Enable corepack, note that nodejs is already installed
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Test all packages
        run: pnpm -r test

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Enable corepack, note that nodejs is already installed
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r build
