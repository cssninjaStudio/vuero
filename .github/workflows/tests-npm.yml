name: tests-npm

on:
  workflow_call:

jobs:
  build-npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"


      # install dependencies if the cache did not hit
      - name: Install dependencies
        run: npm install

      - name: Build (npm)
        run: NODE_OPTIONS=--max-old-space-size=4096 npm run build
