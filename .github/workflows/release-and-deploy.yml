name: cssninja / continuous integration
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Test release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [14.x, 16.x]

    steps:
      - name: Vuero ${{ matrix.os }} - Node.js ${{ matrix.node-version }}
        uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - run: yarn
      - run: yarn build

  release:
    name: Build release package
    runs-on: ubuntu-latest
    needs: test

    outputs:
      project: ${{ steps.meta.outputs.project }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v2

      - name: Get the version from tag
        id: meta
        run: |
          echo ::set-output name=project::${GITHUB_REPOSITORY#*/}
          echo ::set-output name=tag::${GITHUB_REF#refs/tags/}

      - uses: actions/setup-node@v1
        with:
          node-version: '14.x'

      - run: yarn

      - name: Build release zip archive
        timeout-minutes: 60
        run: |
          sudo apt-get install zip
          ./.release/build-envato-archive.sh ${{ steps.meta.outputs.project }} ${{ steps.meta.outputs.tag }}

      - name: Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Vuero ${{ steps.meta.outputs.tag }}
          body: View [CHANGELOG.md](https://github.com/cssninjaStudio/vuero/blob/main/CHANGELOG.md) for details
          draft: false
          prerelease: false
          files: ./.release/release-${{ steps.meta.outputs.project }}-${{ steps.meta.outputs.tag }}.zip
          discussion_category_name: announcements

  deploy:
    name: Demo deployment
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Set up dockertags
        id: get_meta
        run: |
          echo ::set-output name=dockertags::digisquad/cssninja.vuero-demo:latest,digisquad/cssninja.vuero-demo:${GITHUB_REF#refs/tags/}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        timeout-minutes: 60
        with:
          push: true
          tags: ${{ steps.get_meta.outputs.dockertags }}

      - name: Deploy to cssninja.io
        uses: appleboy/ssh-action@master
        with:
          host: cssninja.io
          username: ci
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.HOST_DIRECTORY }}
            git pull
            docker-compose pull
            docker-compose up -d --force-recreate --remove-orphans
