name: cssninjaStudio / release-and-deploy
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  tests-e2e:
    uses: ./.github/workflows/tests-e2e.yml

  release:
    runs-on: ubuntu-latest
    needs: [tests, tests-e2e]

    outputs:
      project: ${{ steps.meta.outputs.project }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v3
      - name: Get the version from tag
        id: meta
        run: |
          echo ::set-output name=project::${GITHUB_REPOSITORY#*/}
          echo ::set-output name=tag::${GITHUB_REF#refs/tags/}

      - uses: actions/setup-node@v3
        with:
          node-version: '16.x'

      # cache node_modules
      - name: Cache dependencies
        uses: actions/cache@v3
        id: yarn-cache
        with:
          path: |
            **/node_modules
          key: ${{ matrix.os }}-${{ matrix.node-version }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.node-version }}-yarn-

      # install dependencies if the cache did not hit
      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile

      - name: Build release zip archive
        timeout-minutes: 60
        run: |
          sudo apt-get install zip
          ./.release/build-envato-archive.sh ${{ steps.meta.outputs.project }} ${{ steps.meta.outputs.tag }}

      - name: Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Vuero ${{ steps.meta.outputs.tag }}
          body: View [CHANGELOG.md](https://github.com/cssninjaStudio/vuero/blob/main/CHANGELOG.md) for details
          draft: false
          prerelease: false
          files: ./.release/release-${{ steps.meta.outputs.project }}-${{ steps.meta.outputs.tag }}.zip

  deploy:
    runs-on: ubuntu-latest
    needs: [release]

    steps:
      - name: Set up dockertags
        id: get_meta
        run: |
          echo ::set-output name=dockertags::digisquad/cssninja.vuero-demo:latest,digisquad/cssninja.vuero-demo:${GITHUB_REF#refs/tags/}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v3
        timeout-minutes: 60
        with:
          push: true
          tags: ${{ steps.get_meta.outputs.dockertags }}
          build-args: |
            VITE_API_BASE_URL=https://api.vuero.cssninja.io
            GTM_ID=GTM-N9P6H6B
            SOURCE_MAP=false
            MINIFY=true

      - name: Publish
        uses: appleboy/scp-action@master
        with:
          host: cssninja.io
          username: ci
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.yml'
          target: ${{ secrets.HOST_DIRECTORY }}

      - name: Deploy to cssninja.io
        uses: appleboy/ssh-action@master
        with:
          host: cssninja.io
          username: ci
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.HOST_DIRECTORY }}
            docker-compose pull
            docker-compose up -d --force-recreate --remove-orphans
            docker image prune -f -a --filter "until=24h"
