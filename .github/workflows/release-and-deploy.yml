name: cssninja / continuous integration
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node-version: [14.x, 15.x]

    steps:
      - name: Vuero ${{ matrix.os }} - Node.js ${{ matrix.node-version }}
        uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - run: yarn
      - run: yarn build

  release:
    name: Build release package
    runs-on: ubuntu-latest
    needs: test

    outputs:
      project: ${{ steps.meta.outputs.project }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v2

      - name: Get the version from tag
        id: meta
        run: |
          echo ::set-output name=project::${GITHUB_REPOSITORY#*/}
          echo ::set-output name=tag::${GITHUB_REF#refs/tags/}

      - uses: actions/setup-node@v1
        with:
          node-version: '14.x'

      - run: yarn
      - run: yarn test
      - run: yarn build

      - name: Build release zip archive
        run: |
          sudo apt-get install zip
          cp .release/documentation.pdf .
          zip -r template-${{ steps.meta.outputs.project }}-${{ steps.meta.outputs.tag }}.zip . \ 
            -x "*.zip" \
            -x "node_modules/*" \
            -x ".release/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "public/demo/*" \
            -x "dist/demo/*" \
            -x "docker-compose.yml"
          zip -j ${{ steps.meta.outputs.project }}-preview.zip \
            .release/${{ steps.meta.outputs.project }}-preview.png
          zip -j release-${{ steps.meta.outputs.project }}-${{ steps.meta.outputs.tag }}.zip \
            template-${{ steps.meta.outputs.project }}-${{ steps.meta.outputs.tag }}.zip \
            ${{ steps.meta.outputs.project }}-preview.zip \
            .release/${{ steps.meta.outputs.project }}-thumb.png

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          release_name: Release ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release-${{ steps.meta.outputs.project }}-${{ steps.meta.outputs.tag }}.zip
          asset_name: release-${{ steps.meta.outputs.project }}-${{ steps.meta.outputs.tag }}.zip
          asset_content_type: application/zip

  deploy:
    name: Demo deployment
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: ${{ needs.release.outputs.tag }}

      - name: Deploy to cssninja.io
        uses: appleboy/ssh-action@master
        with:
          host: cssninja.io
          username: ci
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.HOST_DIRECTORY }}
            git pull
            docker-compose pull
            docker-compose up -d --force-recreate --remove-orphans
