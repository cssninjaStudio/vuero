name: cssninja / continuous integration
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    name: Build release package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Get the version from tag
        id: get_meta
        run: |
          echo ::set-output name=project::${GITHUB_REPOSITORY#*/}
          echo ::set-output name=tag::${GITHUB_REF#refs/tags/}

      - uses: actions/setup-node@v1
        with:
          node-version: '14.x'

      - uses: pnpm/action-setup@v1.2.1
        with:
          version: 5.14.1
          run_install: true

      - name: Build dist/ folder
        run: NODE_ENV=production pnpm build

      - name: Build release zip archive
        run: |
          sudo apt-get install zip
          cp .release/documentation.pdf .
          zip -r template-${{ steps.get_meta.outputs.project }}-${{ steps.get_meta.outputs.tag }}.zip . -x "*.zip" -x "node_modules/*" -x ".release/*" -x ".git/*" -x ".github/*" -x ".gitignore" -x "public/images/photo/*" -x "dist/images/photo/*" -x "public/images/avatars/photo/*" -x "dist/images/avatars/photo/*" -x "docker-compose.yml"
          zip -j ${{ steps.get_meta.outputs.project }}-preview.zip .release/${{ steps.get_meta.outputs.project }}-preview.png
          zip -j release-${{ steps.get_meta.outputs.project }}-${{ steps.get_meta.outputs.tag }}.zip template-${{ steps.get_meta.outputs.project }}-${{ steps.get_meta.outputs.tag }}.zip ${{ steps.get_meta.outputs.project }}-preview.zip .release/${{ steps.get_meta.outputs.project }}-thumb.png

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release-${{ steps.get_meta.outputs.project }}-${{ steps.get_meta.outputs.tag }}.zip
          asset_name: release-${{ steps.get_meta.outputs.project }}-${{ steps.get_meta.outputs.tag }}.zip
          asset_content_type: application/zip

  demo-deploy:
    name: Demo deployment
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          push: true
          tags:
            - digisquad/cssninja.vuero-demo:latest
            - digisquad/cssninja.vuero-demo:${GITHUB_REF#refs/tags/}

      - name: Deploy to cssninja.io
        uses: appleboy/ssh-action@master
        with:
          host: cssninja.io
          username: ci
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.HOST_DIRECTORY }}
            git pull
            docker-compose pull
            docker-compose up -d --force-recreate --remove-orphans
